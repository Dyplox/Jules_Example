<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17e886",
                        "dark-header": "#1B4332",
                        "tactical-orange": "#EA580C",
                        "background-light": "#f6f8f7",
                        "background-dark": "#11211a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"],
                        "tactical": ["IBM Plex Sans"]
                    },
                    borderWidth: {
                        '4': '4px',
                    },
                    borderRadius: {
                        "none": "0px",
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
        }
        .tactical-input {
            border-radius: 0px !important;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 18px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<!-- Header Robusto -->
<header class="bg-dark-header text-white p-4 flex items-center justify-between border-b-4 border-primary">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">agriculture</span>
<h2 class="font-display text-2xl font-bold tracking-tighter">GANADEPRO</h2>
</div>
<div class="flex items-center gap-2 bg-black/20 px-3 py-1 border border-primary/30">
<span class="material-symbols-outlined text-[14px] text-primary">sync_disabled</span>
<span class="text-[10px] font-bold tracking-widest font-tactical">SYNC: OFFLINE</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col p-6 max-w-lg mx-auto w-full">
<div class="mb-8 mt-4">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-bold font-display uppercase tracking-tight">INICIO DE SESIÓN</h1>
<div class="h-1.5 w-20 bg-primary mt-2"></div>
<p class="text-slate-600 dark:text-slate-400 mt-4 text-lg">Acceso táctico para gestión de ganado en campo.</p>
</div>
<form class="space-y-6">
<!-- Campo Email/Teléfono -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 font-bold uppercase tracking-wider text-sm">Identificación (Email o Teléfono)</label>
<div class="relative">
<input class="tactical-input w-full h-16 border-4 border-dark-header bg-white px-4 focus:ring-0 focus:border-primary text-slate-900" placeholder="EJ: +34 600 000 000" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-dark-header/40">contact_mail</span>
</div>
</div>
<!-- Campo Contraseña -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 font-bold uppercase tracking-wider text-sm">Contraseña de Seguridad</label>
<div class="relative">
<input class="tactical-input w-full h-16 border-4 border-dark-header bg-white px-4 focus:ring-0 focus:border-primary text-slate-900" placeholder="********" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-dark-header/40">lock</span>
</div>
</div>
<!-- Campo Confirmar Contraseña -->
<div class="pt-4">
<!-- Botón CREAR CUENTA -->
<button class="w-full bg-tactical-orange hover:bg-orange-700 text-white font-tactical font-black text-xl py-6 border-b-8 border-orange-900 active:border-b-0 active:translate-y-1 transition-all uppercase tracking-widest" type="submit">ENTRAR AL SISTEMA</button>
</div>
</form>
<!-- Link Volver al Login -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 text-dark-header dark:text-primary font-bold uppercase tracking-tighter hover:underline decoration-2 underline-offset-4" href="#"><span class="material-symbols-outlined">arrow_forward</span> ¿NO TIENES CUENTA? REGISTRARSE</a>
</div>
</main>
<!-- Bottom Navigation Simulado -->
<nav class="bg-white border-t-4 border-dark-header flex justify-around items-center py-2 px-4 mt-auto">
<a class="flex flex-col items-center gap-1 p-2 text-dark-header/40" href="#">
<span class="material-symbols-outlined text-2xl">home</span>
<span class="text-[10px] font-bold uppercase">Inicio</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-dark-header/40" href="#">
<span class="material-symbols-outlined text-2xl">sync</span>
<span class="text-[10px] font-bold uppercase">Sinc</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-dark-header" href="#">
<span class="material-symbols-outlined text-2xl">person_add</span>
<span class="text-[10px] font-bold uppercase">Registro</span>
</a>
</nav>
<div class="fixed bottom-0 left-0 w-full h-1 bg-primary"></div>
</body></html>
