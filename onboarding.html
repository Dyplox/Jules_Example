<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GANADEPRO - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;family=Space+Grotesk:wght@400;700&amp;family=Public+Sans:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#14b876",
                        "tactical-orange": "#f97316",
                        "background-light": "#ffffff",
                        "background-dark": "#11211b",
                    },
                    fontFamily: {
                        "display": ["Oswald", "sans-serif"],
                        "body": ["Space Grotesk", "sans-serif"],
                        "sans": ["Public Sans", "sans-serif"]
                    },
                    borderWidth: {
                        '4': '4px',
                    },
                    borderRadius: {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .tactical-border { border: 4px solid #000000; }
        .shadow-tactical { box-shadow: 6px 6px 0px 0px #000000; }
        .shadow-tactical-sm { box-shadow: 4px 4px 0px 0px #000000; }
        .bg-grid-pattern {
            background-image: radial-gradient(#00000022 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-body text-slate-900">
<div class="relative flex h-screen w-full flex-col bg-background-light overflow-hidden bg-grid-pattern">
<!-- Header: Tactical Offline/Online Status -->
<header class="flex items-center justify-between p-4 bg-background-light border-b-4 border-black">
<div class="flex items-center gap-2 px-3 py-1 bg-primary border-2 border-black shadow-tactical-sm">
<span class="material-symbols-outlined text-sm font-bold">wifi_off</span>
<span class="font-display text-xs tracking-widest uppercase">Modo Offline Activo</span>
</div>
<div class="flex items-center gap-4">
<div class="flex flex-col items-end">
<span class="text-[10px] font-bold uppercase tracking-tighter leading-none">Señal Satelital</span>
<span class="text-xs font-bold font-display">GPS: 100%</span>
</div>
<div class="size-10 flex items-center justify-center border-2 border-black bg-white shadow-tactical-sm">
<span class="material-symbols-outlined">battery_5_bar</span>
</div>
</div>
</header>
<!-- Main Content Section -->
<main class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
<!-- Tactical Branding/Illustration -->
<div class="w-full max-w-sm aspect-square bg-white border-4 border-black shadow-tactical relative flex items-center justify-center overflow-hidden">
<div class="absolute top-2 left-2 flex gap-1">
<div class="w-2 h-2 bg-tactical-orange"></div>
<div class="w-2 h-2 bg-black"></div>
</div>
<!-- Visual Component -->
<div class="flex flex-col items-center">
<div class="text-[120px] text-black leading-none mb-2">
<span class="material-symbols-outlined !text-[120px]">agriculture</span>
</div>
<div class="px-4 py-1 bg-black text-white font-display text-xl uppercase tracking-[0.2em]">
                        Sector 01-A
                    </div>
</div>
<!-- Crosshair elements for tactical look -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-0.5 h-6 bg-black"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0.5 h-6 bg-black"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-6 h-0.5 bg-black"></div>
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-6 h-0.5 bg-black"></div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4 max-w-md">
<h1 class="font-display text-5xl font-bold leading-none tracking-tight text-black uppercase">
                    BIENVENIDO A <br/>
<span class="text-primary bg-black px-2">GANADEPRO</span>
</h1>
<div class="h-1 w-20 bg-tactical-orange mx-auto"></div>
<p class="text-lg font-medium leading-tight text-slate-800 uppercase tracking-tight">
                    Administración ganadera integral diseñada para el campo. Sin conexión, sin complicaciones.
                </p>
</div>
<!-- Tactical Indicators -->
<div class="flex items-center gap-4 py-2">
<div class="w-12 h-3 bg-primary border-2 border-black"></div>
<div class="w-12 h-3 bg-slate-200 border-2 border-black"></div>
<div class="w-12 h-3 bg-slate-200 border-2 border-black"></div>
</div>
</main>
<!-- Massive CTA Footer -->
<footer class="p-6 bg-background-light border-t-4 border-black">
<button class="w-full bg-primary hover:bg-emerald-500 text-black border-4 border-black py-6 shadow-tactical active:translate-x-1 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-4 group">
<span class="font-display text-3xl font-bold uppercase tracking-widest">SIGUIENTE</span>
<span class="material-symbols-outlined text-3xl font-black group-hover:translate-x-2 transition-transform">arrow_forward</span>
</button>
<div class="mt-4 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-tighter">
<span>VER: 4.2.0-STABLE</span>
<span>ENC: AES-256 MIL-SPEC</span>
</div>
</footer>
</div>
</body></html>
